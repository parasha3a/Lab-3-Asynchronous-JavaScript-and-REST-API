<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа №3 — Доска публикаций</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Доска публикаций</h1>

      <div id="messages" class="message" role="status" aria-live="polite" hidden></div>

      <section class="card">
        <div class="section-header">
          <h2>Публикации</h2>
          <button type="button" id="load-button">Загрузить публикации</button>
        </div>
        <p class="empty" id="post-empty">Нажмите «Загрузить публикации», чтобы получить список.</p>
        <ul class="post-list" id="post-list"></ul>
      </section>

      <section class="card">
        <h2>Новая публикация</h2>
        <form id="post-form" novalidate>
          <div class="field">
            <label for="post-title">Заголовок</label>
            <input id="post-title" type="text" maxlength="100" autocomplete="off" />
            <p class="error" id="post-title-error"></p>
          </div>

          <div class="field">
            <label for="post-body">Текст</label>
            <textarea id="post-body" rows="4" maxlength="500"></textarea>
            <p class="error" id="post-body-error"></p>
          </div>

          <button type="submit" id="submit-button">Создать публикацию</button>
        </form>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
